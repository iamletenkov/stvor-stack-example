# Выпуск стека в Stvor по тегу v<версия> — для self-hosted GitLab с Docker-раннером (executor docker,
# privileged = true для сервиса docker:dind; почему dind — README, «GitLab»).
#
# Settings → CI/CD → Variables:
#   STVOR_URL        https://stvor.example.com — адрес портала
#   STVOR_STACK      слаг стека
#   STVOR_STACK_KEY  ключ CI стека sck_… — Masked и Protected; теги v* защищены (Settings → Repository →
#                    Protected tags), иначе задание по тегу не получит protected-переменную
#   STVOR_COUNTER_OFFSET  необязательно: прибавка к CI_PIPELINE_IID в release_counter
# Своему CA портала должны доверять dind (вход и push) и curl скрипта: CURL_CA_BUNDLE — путь к файлу CA.
# Раннер должен доходить по HTTPS до STVOR_URL и registry.<хост портала>.
# created_at релиза — CI_PIPELINE_CREATED_AT (ISO 8601, scripts/release.sh приводит его к UTC без долей секунды).

stages: [build, publish]

variables:
  PLATFORMS: linux/amd64,linux/arm64

.release-tag: &release-tag
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/

build-stack-images:
  <<: *release-tag
  stage: build
  image: docker:29-cli@sha256:6e26c5a09acc481245d6b50836f1f713c609e51ebc88735c08f5aa4b3c91e15a
  services:
    - name: docker:29-dind@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
      alias: docker
  resource_group: stvor-stack-release
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache jq
    - 'test -n "$STVOR_STACK_KEY" || { echo "Нет masked-переменной STVOR_STACK_KEY (protected — только на защищённом теге)" >&2; exit 2; }'
    - 'test -f stvor-stack-publish.sh || { echo "Нет stvor-stack-publish.sh в корне (он входит в шаблон): верните файл или скачайте его в портале — стек → «Публикация» → «Скачать скрипт»" >&2; exit 2; }'
    - sh ./stvor-stack-publish.sh --self-test
  script:
    - |
      set -eu
      umask 077
      export VERSION="${CI_COMMIT_TAG#v}"
      # Учётка реестра и builder — в каталоге задания; в артефакты он не входит (paths — только dist/).
      export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-release"
      mkdir -p "$DOCKER_CONFIG"
      trap 'rm -f "$DOCKER_CONFIG/config.json"' EXIT
      docker buildx create --use --name stack-release
      docker buildx inspect --bootstrap
      # Dockerfile примера не исполняет RUN в runtime-стадии, эмуляция arm64 не нужна. Если ваш исполняет —
      # раскомментируйте (образ закрепите по digest):
      # docker run --privileged --rm tonistiigi/binfmt --install arm64
      sh scripts/release.sh test
      SOURCE_REPO="$CI_PROJECT_URL" SOURCE_COMMIT="$CI_COMMIT_SHA" sh scripts/release.sh images
      RELEASE_COUNTER="$CI_PIPELINE_IID" CREATED_AT="$CI_PIPELINE_CREATED_AT" \
        SOURCE_REPO="$CI_PROJECT_URL" SOURCE_COMMIT="$CI_COMMIT_SHA" SOURCE_PIPELINE="$CI_PIPELINE_URL" \
        sh scripts/release.sh render
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/]

publish-stack:
  <<: *release-tag
  stage: publish
  image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
  needs: [build-stack-images]
  resource_group: stvor-stack-release
  before_script:
    - apk add --no-cache curl jq
    - 'test -n "$STVOR_STACK_KEY" || { echo "Нет masked-переменной STVOR_STACK_KEY" >&2; exit 2; }'
  script:
    # Повтор только этого задания отправляет те же байты (created_at — время pipeline): ответ 200, тот же id.
    - VERSION="${CI_COMMIT_TAG#v}" sh scripts/release.sh publish
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/]
